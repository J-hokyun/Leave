services:
  vesta-backend:
    build:
      context: ./backend/leave  # backend가 아니라 backend/leave 로 변경!
      dockerfile: Dockerfile
    container_name: leave-app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILE=${SPRING_PROFILE}
      - DB_URL_PROD=${DB_URL_PROD}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "10m"  
        max-file: "3"     