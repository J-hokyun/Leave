server {
    listen 80;
    server_name leavehistory.co.kr www.leavehistory.co.kr;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name leavehistory.co.kr www.leavehistory.co.kr;

    ssl_certificate /etc/letsencrypt/live/leavehistory.co.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/leavehistory.co.kr/privkey.pem;

    location / {
        proxy_pass http://leave-backend:8080; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}